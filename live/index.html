<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>KABE Live 𐙚</title>

<link
    href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,145,212,.08),
            transparent 35%
        ),
        #000;

    color: #fff;

    font-family:
        "Nunito",
        sans-serif;

    overflow-x: hidden;

}

#stars {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 0;

}

.page {

    position: relative;

    z-index: 1;

    max-width: 900px;

    margin: auto;

    padding:
        45px 20px 80px;

}

.header {

    text-align: center;

    margin-bottom: 45px;

}

.kicker {

    color: #ff91d4;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

}

h1 {

    margin: 10px 0;

    font-family:
        "DynaPuff",
        sans-serif;

    color: #ffdff1;

    font-size:
        clamp(30px, 7vw, 48px);

    font-weight: 500;

}

.header p {

    color: #b99aae;

    font-size: 13px;

    line-height: 1.7;

}

.broadcasts {

    display: grid;

    gap: 16px;

}

.broadcast-card {

    padding: 25px;

    border-radius: 24px;

    border:
        1px solid
        rgba(255,145,212,.12);

    background:
        rgba(255,255,255,.018);

    transition: .25s ease;

}

.broadcast-card:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(255,145,212,.3);

}

.status {

    display: inline-flex;

    padding:
        5px 10px;

    border-radius: 999px;

    background:
        rgba(255,145,212,.08);

    color: #ff91d4;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;

}

.status.live {

    background:
        rgba(255,80,150,.15);

    color: #ff75c9;

}

.broadcast-card h2 {

    margin:
        15px 0 7px;

    font-family:
        "DynaPuff",
        sans-serif;

    color: #fff;

    font-size: 22px;

    font-weight: 500;

}

.date {

    color: #9e8493;

    font-size: 11px;

}

.description {

    margin-top: 13px;

    color: #b99aae;

    font-size: 12px;

    line-height: 1.7;

}

.guests {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 17px;

}

.guest {

    padding:
        6px 10px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,145,212,.1);

    background:
        rgba(255,145,212,.04);

    color: #d6aeca;

    font-size: 9px;

    font-weight: 800;

}

.actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 20px;

}

.button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        10px 15px;

    border-radius: 999px;

    background:
        rgba(255,145,212,.1);

    border:
        1px solid
        rgba(255,145,212,.16);

    color: #fff;

    text-decoration: none;

    font-size: 10px;

    font-weight: 800;

}

.button.primary {

    background:
        #ff91d4;

    color: #17000f;

}

.empty {

    text-align: center;

    padding: 45px 20px;

    border-radius: 24px;

    border:
        1px solid
        rgba(255,145,212,.1);

    color: #9e8493;

}

</style>

</head>

<body>

<canvas id="stars"></canvas>

<main class="page">

<header class="header">

<div class="kicker">
KABE 𐙚 LIVE
</div>

<h1>
What's happening?
</h1>

<p>
See upcoming KABE broadcasts, guests,
and everything happening live from the garden. ♡
</p>

</header>

<section
    id="broadcasts"
    class="broadcasts"
></section>

</main>

<script src="/broadcast.js"></script>

<script>

const container =
    document.getElementById(
        "broadcasts"
    );


function renderBroadcasts() {

    const data =
        KABEBroadcast.loadData();


    container.innerHTML = "";


    if (
        !data.broadcasts.length
    ) {

        container.innerHTML = `
            <div class="empty">
                No broadcasts are scheduled yet. 𐙚
            </div>
        `;

        return;

    }


    data.broadcasts.forEach(
        broadcast => {

            const status =
                KABEBroadcast
                    .getBroadcastStatus(
                        broadcast
                    );


            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "broadcast-card";


            let guests = "";


            if (
                Array.isArray(
                    broadcast.guests
                )
            ) {

                guests =
                    broadcast.guests
                        .map(
                            guest =>
                                `<span class="guest">
                                    𐙚 ${guest.name}
                                </span>`
                        )
                        .join("");

            }


            const button =
                status === "live"

                    ? `
                        <a
                            class="button primary"
                            href="/broadcast/room/?room=${encodeURIComponent(broadcast.id)}"
                        >
                            JOIN LIVE →
                        </a>
                    `

                    : `
                        <a
                            class="button"
                            href="/broadcast/room/?room=${encodeURIComponent(broadcast.id)}"
                        >
                            VIEW ROOM
                        </a>
                    `;


            card.innerHTML = `

                <span class="status ${status === "live" ? "live" : ""}">
                    ${
                        status === "live"
                            ? "● LIVE NOW"
                            : status
                    }
                </span>

                <h2>
                    ${broadcast.title}
                </h2>

                <div class="date">
                    ${KABEBroadcast.formatDate(
                        broadcast.date,
                        broadcast.time
                    )}
                </div>

                <div class="description">
                    ${broadcast.description || ""}
                </div>

                <div class="guests">
                    ${guests}
                </div>

                <div class="actions">
                    ${button}
                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


renderBroadcasts();


/* =========================
   STARFIELD
========================= */

const canvas =
    document.getElementById(
        "stars"
    );

const ctx =
    canvas.getContext("2d");

let stars = [];


function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    stars = [];


    const amount =
        Math.min(
            150,
            Math.floor(
                window.innerWidth *
                window.innerHeight /
                7000
            )
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        stars.push({

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                canvas.height,

            size:
                Math.random() *
                1.4 + .3,

            opacity:
                Math.random() *
                .55 + .15

        });

    }

}


function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    stars.forEach(
        star => {

            ctx.beginPath();

            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `rgba(
                    255,
                    210,
                    237,
                    ${star.opacity}
                )`;

            ctx.fill();

        }
    );


    requestAnimationFrame(
        animate
    );

}


window.addEventListener(
    "resize",
    resize
);

resize();

animate();

</script>

</body>

</html>
