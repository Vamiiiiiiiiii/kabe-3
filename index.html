<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kabe.world is under construction</title>

<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: "Nunito", sans-serif;
    overflow-x: hidden;
}

/* Star canvas */
#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

/* Main fade in */
.page {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 720px;

    margin: 0 auto;
    padding: 70px 22px 60px;

    text-align: center;

    opacity: 0;
    transform: translateY(12px);

    animation: pageFadeIn 1.1s ease forwards;
}

@keyframes pageFadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    font-family: "DynaPuff", sans-serif;
    font-size: clamp(58px, 16vw, 105px);
    font-weight: 600;
    letter-spacing: -3px;

    background:
        linear-gradient(
            135deg,
            #fff 0%,
            #ffd4ef 35%,
            #ff86d2 65%,
            #ff5fbd 100%
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter:
        drop-shadow(0 0 20px rgba(255,100,200,.25));

    line-height: .9;
    margin-bottom: 22px;
}

.divider {
    width: 75px;
    height: 2px;

    margin: 0 auto 25px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff91d5,
            transparent
        );

    box-shadow:
        0 0 15px rgba(255,100,200,.5);
}

.message {
    max-width: 550px;
    margin: 0 auto;

    font-size: 15px;
    line-height: 1.7;

    color: #ffe4f4;
}

.message strong {
    color: #ff9ddd;
    font-weight: 800;
}

/* SOCIALS */

.socials {
    margin-top: 48px;
}

.social-title {
    font-family: "DynaPuff", sans-serif;
    font-size: 19px;
    font-weight: 500;

    color: #ffd2ed;

    margin-bottom: 15px;
}

.social-links {
    display: flex;
    justify-content: center;

    gap: 10px;
    flex-wrap: wrap;
}

.social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 135px;

    padding: 10px 16px;

    border-radius: 999px;

    border: 1px solid rgba(255,150,220,.2);

    background: rgba(255,100,200,.035);

    color: #ffdff1;

    text-decoration: none;

    font-size: 11px;
    font-weight: 700;

    transition: .3s ease;
}

.social-link:hover {
    background: rgba(255,100,200,.08);

    border-color: rgba(255,150,220,.5);

    transform: translateY(-2px);

    box-shadow:
        0 0 20px rgba(255,100,200,.1);
}

/* FOOTER */

.footer {
    margin-top: 55px;

    font-size: 10px;

    color: #d6aeca;
}

.footer span {
    color: #ff91d4;
}

/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 55px 18px 45px;
    }

    .logo {
        font-size: 70px;
    }

    .message {
        font-size: 14px;
    }
}
</style>
</head>

<script src="/directory.js"></script>
</body>
</html>

<body>

<canvas id="stars"></canvas>

<main class="page">

    <div class="logo">KABE</div>

    <div class="divider"></div>

    <p class="message">
        <strong>Kabe.world</strong>
        is currently under construction.
        Something special is coming soon. ♡
    </p>

    <section class="socials">

        <div class="social-title">
            find KABE 𐙚
        </div>

        <div class="social-links">

            <a
                class="social-link"
                href="https://instagram.com/kabeworldofficial"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram · @kabeworldofficial
            </a>

            <a
                class="social-link"
                href="https://tiktok.com/@kabeworld"
                target="_blank"
                rel="noopener noreferrer"
            >
                TikTok · @kabeworld
            </a>

        </div>

    </section>

</main>

<script>
/* =========================
   INTERACTIVE STARFIELD
========================= */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

let mouse = {
    x: -1000,
    y: -1000
};

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    createStars();
}

function createStars() {

    stars = [];

    const amount = Math.floor(
        (window.innerWidth * window.innerHeight) / 9000
    );

    for (let i = 0; i < amount; i++) {

        stars.push({

            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,

            size: Math.random() * 1.5 + 0.3,

            baseOpacity:
                Math.random() * 0.45 + 0.2,

            twinkle:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.025 + 0.008
        });
    }
}

function drawStars() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const isTouchDevice =
        window.matchMedia("(hover: none)").matches;

    for (const star of stars) {

        star.twinkle += star.speed;

        const pulse =
            Math.sin(star.twinkle) * 0.12;

        let opacity =
            star.baseOpacity + pulse;

        if (!isTouchDevice) {

            const dx = star.x - mouse.x;
            const dy = star.y - mouse.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            const glowRadius = 150;

            if (distance < glowRadius) {

                const glow =
                    1 - distance / glowRadius;

                opacity += glow * 0.75;

                const glowSize =
                    star.size + glow * 2.2;

                ctx.beginPath();

                ctx.arc(
                    star.x,
                    star.y,
                    glowSize,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(255,255,255,${Math.min(opacity * .18, .3)})`;

                ctx.fill();
            }
        }

        opacity = Math.min(
            Math.max(opacity, 0.05),
            1
        );

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${opacity})`;

        ctx.fill();
    }

    requestAnimationFrame(drawStars);
}

window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "mousemove",
    function (event) {

        mouse.x = event.clientX;
        mouse.y = event.clientY;
    }
);

window.addEventListener(
    "mouseleave",
    function () {

        mouse.x = -1000;
        mouse.y = -1000;
    }
);

resizeCanvas();
drawStars();
</script>

</body>
</html>
