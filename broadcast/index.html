<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>KABE Broadcast 𐙚</title>

<link
    href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,145,212,.08),
            transparent 35%
        ),
        #000;

    color: #fff;

    font-family:
        "Nunito",
        sans-serif;

}

.page {

    width: 100%;

    max-width: 800px;

    margin: auto;

    padding:
        70px 20px;

    text-align: center;

}

.kicker {

    color: #ff91d4;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 2px;

}

h1 {

    margin:
        10px 0;

    font-family:
        "DynaPuff",
        sans-serif;

    color: #ffdff1;

    font-size:
        clamp(32px, 8vw, 52px);

    font-weight: 500;

}

p {

    color: #b99aae;

    font-size: 13px;

    line-height: 1.7;

}

#roomInfo {

    margin-top: 30px;

    padding: 30px;

    border-radius: 25px;

    border:
        1px solid
        rgba(255,145,212,.12);

    background:
        rgba(255,255,255,.018);

}

.button {

    display: inline-flex;

    margin-top: 20px;

    padding:
        12px 20px;

    border-radius: 999px;

    background:
        #ff91d4;

    color: #17000f;

    text-decoration: none;

    font-size: 11px;

    font-weight: 800;

}

</style>

</head>

<body>

<main class="page">

<div class="kicker">
KABE 𐙚 BROADCAST
</div>

<h1>
Broadcast Center
</h1>

<p>
Welcome to the KABE broadcast center.
Join a live room when a broadcast is happening.
</p>

<div id="roomInfo">
Loading...
</div>

</main>

<script src="/broadcast.js"></script>

<script>

const roomInfo =
    document.getElementById(
        "roomInfo"
    );


const data =
    KABEBroadcast.loadData();


const live =
    data.broadcasts.find(
        broadcast =>
            KABEBroadcast
                .getBroadcastStatus(
                    broadcast
                ) === "live"
    );


if (live) {

    roomInfo.innerHTML = `

        <h2>
            ${live.title}
        </h2>

        <p>
            ${live.description || ""}
        </p>

        <a
            class="button"
            href="/broadcast/room/?room=${encodeURIComponent(live.id)}"
        >
            JOIN LIVE →
        </a>

    `;

}

else {

    roomInfo.innerHTML = `

        <h2>
            No live broadcast right now.
        </h2>

        <p>
            Check the KABE Live schedule for upcoming broadcasts. 𐙚
        </p>

        <a
            class="button"
            href="/live"
        >
            VIEW SCHEDULE →
        </a>

    `;

}

</script>

</body>

</html>
