<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>KABE Broadcast Room 𐙚</title>

<link
    href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #000;

    color: #fff;

    font-family:
        "Nunito",
        sans-serif;

}

.page {

    width: 100%;

    max-width: 1200px;

    margin: auto;

    padding:
        20px;

}

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 18px;

}

.logo {

    font-family:
        "DynaPuff",
        sans-serif;

    color: #ffd2ed;

}

.live {

    color: #ff91d4;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;

}

.info {

    margin-bottom: 18px;

}

.info h1 {

    margin: 0;

    font-family:
        "DynaPuff",
        sans-serif;

    font-size:
        clamp(22px, 5vw, 35px);

    font-weight: 500;

    color: #ffdff1;

}

.info p {

    color: #9e8493;

    font-size: 12px;

}

#meet {

    width: 100%;

    min-height: 600px;

    border-radius: 25px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,145,212,.12);

    background:
        #080808;

}

.guest-list {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 18px;

}

.guest {

    padding:
        7px 11px;

    border-radius: 999px;

    background:
        rgba(255,145,212,.06);

    border:
        1px solid
        rgba(255,145,212,.1);

    color: #d6aeca;

    font-size: 9px;

    font-weight: 800;

}

.back {

    display: inline-block;

    margin-top: 18px;

    color: #ff91d4;

    font-size: 10px;

    font-weight: 800;

    text-decoration: none;

}

@media (max-width: 700px) {

    .page {
        padding: 12px;
    }

    #meet {
        min-height: 550px;
    }

}

</style>

</head>

<body>

<main class="page">

<header class="header">

<div class="logo">
KABE 𐙚
</div>

<div
    id="status"
    class="live"
>
LOADING
</div>

</header>


<section class="info">

<h1 id="title">
KABE Broadcast
</h1>

<p id="description">
Loading broadcast...
</p>

<div
    id="guestList"
    class="guest-list"
></div>

</section>


<div id="meet"></div>


<a
    class="back"
    href="/live"
>
← Back to KABE Live
</a>


</main>


<script src="/broadcast.js"></script>

<script src="https://meet.jit.si/external_api.js"></script>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const roomId =
    params.get("room");


const data =
    KABEBroadcast.loadData();


const broadcast =
    data.broadcasts.find(
        item =>
            item.id === roomId
    );


const title =
    document.getElementById(
        "title"
    );


const description =
    document.getElementById(
        "description"
    );


const status =
    document.getElementById(
        "status"
    );


const guestList =
    document.getElementById(
        "guestList"
    );


if (!broadcast) {

    title.textContent =
        "Broadcast not found";


    description.textContent =
        "This broadcast room does not exist.";


    status.textContent =
        "NOT FOUND";

}

else {

    title.textContent =
        broadcast.title;


    description.textContent =
        broadcast.description || "";


    status.textContent =
        KABEBroadcast
            .getBroadcastStatus(
                broadcast
            ).toUpperCase();


    if (
        Array.isArray(
            broadcast.guests
        )
    ) {

        guestList.innerHTML =
            broadcast.guests
                .map(
                    guest =>
                        `<span class="guest">
                            𐙚 ${guest.name}
                        </span>`
                )
                .join("");

    }


    /*
       Each KABE broadcast gets
       its own Jitsi room.
    */

    const domain =
        "meet.jit.si";


    const options = {

        roomName:
            "KABE_" +
            broadcast.id,

        width:
            "100%",

        height:
            600,

        parentNode:
            document.querySelector(
                "#meet"
            ),

        userInfo: {

            displayName:
                "KABE Guest"

        },

        configOverwrite: {

            prejoinConfig: {

                enabled: true

            },

            startWithAudioMuted:
                false,

            startWithVideoMuted:
                false

        }

    };


    new JitsiMeetExternalAPI(
        domain,
        options
    );

}

</script>

</body>

</html>
