<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KABE Shop — Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    background: #000;

    color: #fff;

    font-family: "Nunito", sans-serif;

    overflow-x: hidden;
}


/* STARFIELD */

#stars {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 0;
}


/* PAGE */

.page {
    position: relative;

    z-index: 1;

    width: 100%;

    max-width: 720px;

    min-height: 100vh;

    margin: 0 auto;

    padding: 65px 22px 40px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    opacity: 0;

    transform: translateY(12px);

    animation: pageFadeIn 1.1s ease forwards;
}


@keyframes pageFadeIn {

    from {
        opacity: 0;

        transform: translateY(12px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


/* BACK BUTTON */

.back {
    display: inline-block;

    margin-bottom: 55px;

    padding: 8px 14px;

    border-radius: 999px;

    border: 1px solid rgba(255,150,220,.2);

    background: rgba(255,100,200,.035);

    color: #ffdff1;

    text-decoration: none;

    font-size: 11px;

    font-weight: 700;

    transition: .3s ease;
}


.back:hover {
    color: #ff91d4;

    border-color: rgba(255,150,220,.5);

    background: rgba(255,100,200,.08);

    transform: translateY(-2px);
}


/* LOGO */

.logo {
    font-family: "DynaPuff", sans-serif;

    font-size: clamp(58px, 16vw, 95px);

    font-weight: 600;

    letter-spacing: -3px;

    background:
        linear-gradient(
            135deg,
            #fff 0%,
            #ffd4ef 35%,
            #ff86d2 65%,
            #ff5fbd 100%
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(0 0 20px rgba(255,100,200,.25));

    line-height: .9;

    margin-bottom: 20px;
}


/* DIVIDER */

.divider {
    width: 75px;

    height: 2px;

    margin: 0 auto 28px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff91d5,
            transparent
        );

    box-shadow:
        0 0 15px rgba(255,100,200,.5);
}


/* TITLE */

.title {
    font-family: "DynaPuff", sans-serif;

    font-size: clamp(27px, 7vw, 36px);

    font-weight: 500;

    color: #ffd2ed;

    margin-bottom: 12px;
}


.subtitle {
    font-size: 13px;

    line-height: 1.8;

    color: #d6aeca;

    max-width: 470px;

    margin-bottom: 30px;
}


/* COMING SOON CARD */

.coming-soon {
    width: 100%;

    max-width: 520px;

    padding: 30px 24px;

    border-radius: 20px;

    border: 1px solid rgba(255,150,220,.15);

    background: rgba(255,100,200,.035);

    box-shadow:
        0 0 35px rgba(255,100,200,.035);

    transition: .3s ease;
}


.coming-soon:hover {
    border-color: rgba(255,150,220,.3);

    background: rgba(255,100,200,.05);

    transform: translateY(-2px);

    box-shadow:
        0 0 45px rgba(255,100,200,.07);
}


.shop-icon {
    font-size: 34px;

    margin-bottom: 14px;

    filter:
        drop-shadow(0 0 10px rgba(255,100,200,.3));
}


.card-title {
    font-family: "DynaPuff", sans-serif;

    font-size: 20px;

    color: #ffd2ed;

    margin-bottom: 10px;
}


.card-text {
    font-size: 12px;

    line-height: 1.8;

    color: #ffe4f4;
}


/* LITTLE HEART */

.heart {
    display: inline-block;

    margin-top: 18px;

    color: #ff91d4;

    font-size: 18px;

    animation: floatHeart 2.5s ease-in-out infinite;
}


@keyframes floatHeart {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


/* FOOTER */

.footer {
    margin-top: auto;

    padding-top: 70px;

    font-size: 10px;

    color: #d6aeca;
}


.footer span {
    color: #ff91d4;
}


/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 45px 18px 35px;
    }

    .back {
        margin-bottom: 45px;
    }

    .logo {
        font-size: 70px;
    }

    .title {
        font-size: 27px;
    }

    .coming-soon {
        padding: 26px 19px;
    }

}

</style>

</head>


<body>


<canvas id="stars"></canvas>


<main class="page">


    <a class="back" href="/">
        ← Back Home
    </a>


    <div class="logo">
        KABE
    </div>


    <div class="divider"></div>


    <h1 class="title">
        KABE Shop 𐙚
    </h1>


    <p class="subtitle">

        Something special is being made.
        Check back soon for the official KABE shop. ♡

    </p>


    <section class="coming-soon">

        <div class="shop-icon">
            🛍️
        </div>

        <h2 class="card-title">
            Coming Soon
        </h2>

        <p class="card-text">

            The KABE Shop is currently under construction.
            Cute things are on the way, so stay tuned for
            the official launch. ♡

        </p>

        <div class="heart">
            𐙚
        </div>
</main>


<script src="/directory.js"></script>


<script>

/* =========================
   INTERACTIVE STARFIELD
========================= */

const canvas = document.getElementById("stars");

const ctx = canvas.getContext("2d");

let stars = [];


let mouse = {
    x: -1000,
    y: -1000
};


function resizeCanvas() {

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

    createStars();

}


function createStars() {

    stars = [];


    const amount = Math.floor(
        (window.innerWidth * window.innerHeight) / 9000
    );


    for (let i = 0; i < amount; i++) {

        stars.push({

            x: Math.random() * canvas.width,

            y: Math.random() * canvas.height,

            size: Math.random() * 1.5 + 0.3,

            baseOpacity:
                Math.random() * 0.45 + 0.2,

            twinkle:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.025 + 0.008

        });

    }

}


function drawStars() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const isTouchDevice =
        window.matchMedia("(hover: none)").matches;


    for (const star of stars) {

        star.twinkle += star.speed;


        const pulse =
            Math.sin(star.twinkle) * 0.12;


        let opacity =
            star.baseOpacity + pulse;


        if (!isTouchDevice) {

            const dx =
                star.x - mouse.x;

            const dy =
                star.y - mouse.y;


            const distance =
                Math.sqrt(dx * dx + dy * dy);


            const glowRadius = 150;


            if (distance < glowRadius) {

                const glow =
                    1 - distance / glowRadius;


                opacity += glow * 0.75;


                const glowSize =
                    star.size + glow * 2.2;


                ctx.beginPath();


                ctx.arc(
                    star.x,
                    star.y,
                    glowSize,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(255,255,255,${Math.min(opacity * .18, .3)})`;


                ctx.fill();

            }

        }


        opacity = Math.min(
            Math.max(opacity, 0.05),
            1
        );


        ctx.beginPath();


        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(255,255,255,${opacity})`;


        ctx.fill();

    }


    requestAnimationFrame(drawStars);

}


window.addEventListener(
    "resize",
    resizeCanvas
);


window.addEventListener(
    "mousemove",
    function (event) {

        mouse.x = event.clientX;

        mouse.y = event.clientY;

    }
);


window.addEventListener(
    "mouseleave",
    function () {

        mouse.x = -1000;

        mouse.y = -1000;

    }
);


resizeCanvas();

drawStars();

</script>


</body>

</html>
