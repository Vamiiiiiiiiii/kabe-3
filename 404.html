<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 · Kabe.world</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            background: #000;

            color: #fff;

            font-family: "Nunito", sans-serif;

            overflow: hidden;
        }


        /* =========================
           INTERACTIVE STARS
        ========================= */

        #stars {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 0;
        }


        /* =========================
           TOP NAVIGATION
        ========================= */

        .top-nav {
            position: fixed;

            top: 14px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 20;

            width: fit-content;

            max-width: calc(100% - 20px);

            padding: 9px 10px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 4px;

            flex-wrap: nowrap;

            border:
                1px solid
                rgba(255,145,212,.13);

            border-radius: 999px;

            background:
                rgba(0,0,0,.72);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 10px 40px
                rgba(0,0,0,.35),

                0 0 30px
                rgba(255,145,212,.04);
        }


        .top-nav a {
            color: #d6aeca;

            text-decoration: none;

            font-size: 11px;

            font-weight: 800;

            padding: 8px 14px;

            border-radius: 999px;

            white-space: nowrap;

            transition: .25s ease;
        }


        .top-nav a:hover {
            color: #fff;

            background:
                rgba(255,145,212,.11);
        }


        .nav-logo {
            font-family:
                "DynaPuff",
                sans-serif;

            color: #ffd2ed;

            font-size: 13px;

            padding: 8px 14px;

            margin-right: 2px;

            white-space: nowrap;
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 650px;

            min-height: 100vh;

            margin: 0 auto;

            padding:
                110px 22px 40px;

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                pageFadeIn 1.1s ease
                forwards;
        }


        @keyframes pageFadeIn {

            from {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================
           404
        ========================= */

        .error-code {
            font-family:
                "DynaPuff",
                sans-serif;

            font-size:
                clamp(
                    95px,
                    25vw,
                    170px
                );

            font-weight: 600;

            line-height: .9;

            letter-spacing: -7px;

            background:
                linear-gradient(
                    135deg,
                    #fff 0%,
                    #ffd4ef 30%,
                    #ff86d2 65%,
                    #ff5fbd 100%
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255,100,200,.25)
                );

            margin-bottom: 18px;
        }


        .divider {
            width: 75px;

            height: 2px;

            margin:
                0 auto 25px;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff91d5,
                    transparent
                );

            box-shadow:
                0 0 15px
                rgba(255,100,200,.5);
        }


        .title {
            font-family:
                "DynaPuff",
                sans-serif;

            font-size: 25px;

            font-weight: 500;

            color: #ffd0ef;

            margin-bottom: 12px;
        }


        .message {
            max-width: 500px;

            margin: 0 auto;

            font-size: 14px;

            line-height: 1.7;

            color: #ffe4f4;
        }


        .message strong {
            color: #ff9ddd;

            font-weight: 800;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .home-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin-top: 28px;

            padding:
                13px 24px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #ff91d4,
                    #ff69c4
                );

            color: #17000f;

            text-decoration: none;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.2px;

            box-shadow:
                0 0 25px
                rgba(255,100,200,.12);

            transition: .3s ease;
        }


        .home-button:hover {
            transform:
                translateY(-3px);

            box-shadow:
                0 0 35px
                rgba(255,100,200,.25);

            filter:
                brightness(1.08);
        }


        .home-button:active {
            transform:
                scale(.97);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 55px;

            font-size: 10px;

            color: #d6aeca;
        }


        .footer span {
            color: #ff91d4;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .top-nav {
                display: none;
            }


            .page {
                padding:
                    35px 18px 35px;
            }


            .error-code {
                font-size: 115px;
            }


            .title {
                font-size: 22px;
            }


            .message {
                font-size: 14px;
            }

        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .error-code {
                font-size: 100px;
            }


            .title {
                font-size: 20px;
            }


            .message {
                font-size: 13px;
            }


            .home-button {
                padding:
                    12px 21px;
            }

        }

    </style>

</head>


<body>


    <canvas id="stars"></canvas>


    <!-- =========================
         TOP NAVIGATION
    ========================= -->

    <nav class="top-nav">

        <div class="nav-logo">
            KABE 𐙚
        </div>


        <a href="/">
            Home
        </a>


        <a href="/news">
            News
        </a>


        <a href="/music">
            Music
        </a>


        <a href="/careers">
            Careers
        </a>


        <a href="/credits">
            Credits
        </a>

    </nav>


    <!-- =========================
         404 CONTENT
    ========================= -->

    <main class="page">

        <div class="error-code">
            404
        </div>


        <div class="divider"></div>


        <h1 class="title">
            oopsie 𐙚
        </h1>


        <p
            class="message"
            id="random-message"
        ></p>


        <a
            class="home-button"
            href="/"
        >
            TAKE ME HOME →
        </a>


        <footer class="footer">

            made with
            <span>♡</span>
            for KABE · © 2026 KABE

        </footer>

    </main>


    <script>

        /* =========================
           RANDOM 404 JOKES
        ========================= */

        const jokes = [

            "This page went on a little adventure without telling us.",

            "404. The page said bye-bye. 𐙚",

            "Oopsie. Someone misplaced the internet.",

            "This page is currently hiding from KABE.",

            "We looked everywhere. Even under the couch.",

            "The page you wanted has left the group chat.",

            "This page is not having a KABE moment right now.",

            "404. Nothing to see here... unless you like stars.",

            "The page took a vacation. No ETA.",

            "KABE tried looking. KABE found nothing. ♡",

            "This page got lost somewhere between here and nowhere.",

            "The page is currently experiencing a tiny identity crisis.",

            "Oops! This page forgot where it lives.",

            "This isn't the page you're looking for. It's shy.",

            "The page has disappeared into the KABE void. 𐙚",

            "We asked the page where it went. It did not respond.",

            "404. The vibes are here. The page is not.",

            "This page is currently unavailable for being iconic.",

            "Somebody tell the page to come home.",

            "The internet looked at this page and said 'girl, no.'",

            "This page bloomed somewhere else.",

            "The page is taking a very mysterious little break.",

            "KABE searched the garden. Nothing.",

            "You found the secret page. Unfortunately, it is empty.",

            "This page went outside and forgot its keys.",

            "The page is somewhere between loading and existing.",

            "Oopsie. This flower never bloomed.",

            "The page got lost in the KABE garden.",

            "404. Even the stars don't know where this page went.",

            "We tried refreshing it. It chose peace.",

            "This page has officially entered its disappearing era.",

            "The page is hiding. Please respect its privacy. 𐙚",

            "This URL is giving absolutely nothing.",

            "The page clocked out early today.",

            "The page has left the building. No forwarding address.",

            "We found the stars, but not the page.",

            "This page is somewhere having a main-character moment.",

            "The internet put this page on read.",

            "404. KABE's garden has one missing flower.",

            "This page was here a second ago. Probably.",

            "The page said 'brb' and never came back.",

            "Someone misplaced this little corner of the internet.",

            "The page is currently lost in thought.",

            "No page here. Just vibes. ♡",

            "This page forgot to RSVP.",

            "The URL walked in the wrong direction.",

            "The page has gone missing. The stars are investigating.",

            "This page couldn't find its way home.",

            "404. The garden gate is closed for this page.",

            "This page is taking the scenic route.",

            "The page has been spotted nowhere nearby.",

            "We checked. We double-checked. Still no page.",

            "This page is currently on a tiny vacation.",

            "The page disappeared faster than our motivation.",

            "KABE called. The page didn't answer.",

            "This page is apparently allergic to existing.",

            "404. Please send flowers.",

            "The page is currently somewhere it shouldn't be.",

            "This is definitely not the page. Cute though. 𐙚",

            "The page got distracted by the stars.",

            "Something bloomed here. It wasn't the page.",

            "The page is currently unavailable for mysterious reasons.",

            "We lost the page. If found, please return it to KABE.",

            "This page has entered the void.",

            "The garden is open. This page isn't here.",

            "404. A little oopsie happened.",

            "This page simply chose not to participate.",

            "The page went missing and left no note.",

            "We would tell you where the page is, but we have absolutely no idea."

        ];


        const randomMessage =
            jokes[
                Math.floor(
                    Math.random() *
                    jokes.length
                )
            ];


        document.getElementById(
            "random-message"
        ).innerHTML =
            randomMessage +
            "<br>The page you're looking for doesn't exist on <strong>Kabe.world</strong>.";


        /* =========================
           INTERACTIVE STARFIELD
        ========================= */

        const canvas =
            document.getElementById("stars");


        const ctx =
            canvas.getContext("2d");


        let stars = [];


        let mouse = {
            x: -1000,
            y: -1000
        };


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

            createStars();

        }


        function createStars() {

            stars = [];


            const amount =
                Math.floor(
                    (
                        window.innerWidth *
                        window.innerHeight
                    ) / 8500
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    size:
                        Math.random() *
                        1.5 + .3,

                    baseOpacity:
                        Math.random() *
                        .45 + .2,

                    twinkle:
                        Math.random() *
                        Math.PI * 2,

                    speed:
                        Math.random() *
                        .025 + .008

                });

            }

        }


        function drawStars() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            const isTouchDevice =
                window.matchMedia(
                    "(hover: none)"
                ).matches;


            for (const star of stars) {

                star.twinkle +=
                    star.speed;


                const pulse =
                    Math.sin(
                        star.twinkle
                    ) * .12;


                let opacity =
                    star.baseOpacity +
                    pulse;


                if (!isTouchDevice) {

                    const dx =
                        star.x - mouse.x;


                    const dy =
                        star.y - mouse.y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    const glowRadius = 150;


                    if (
                        distance <
                        glowRadius
                    ) {

                        const glow =
                            1 -
                            distance /
                            glowRadius;


                        opacity +=
                            glow * .75;


                        const glowSize =
                            star.size +
                            glow * 2.2;


                        ctx.beginPath();


                        ctx.arc(
                            star.x,
                            star.y,
                            glowSize,
                            0,
                            Math.PI * 2
                        );


                        ctx.fillStyle =
                            `rgba(255,255,255,${Math.min(
                                opacity * .18,
                                .3
                            )})`;


                        ctx.fill();

                    }

                }


                opacity =
                    Math.min(
                        Math.max(
                            opacity,
                            .05
                        ),
                        1
                    );


                ctx.beginPath();


                ctx.arc(
                    star.x,
                    star.y,
                    star.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(255,255,255,${opacity})`;


                ctx.fill();

            }


            requestAnimationFrame(
                drawStars
            );

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        window.addEventListener(
            "mousemove",
            function (event) {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;

            }
        );


        window.addEventListener(
            "mouseleave",
            function () {

                mouse.x = -1000;

                mouse.y = -1000;

            }
        );


        resizeCanvas();

        drawStars();

    </script>

</body>

</html>
