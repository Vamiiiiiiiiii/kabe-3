<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 · Kabe.world</title>

<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;

    background: #000;
    color: #fff;

    font-family: "Nunito", sans-serif;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Interactive stars */
#stars {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 0;
}

/* Fade in */
.page {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 650px;

    padding: 40px 22px;

    text-align: center;

    opacity: 0;
    transform: translateY(12px);

    animation: pageFadeIn 1.1s ease forwards;
}

@keyframes pageFadeIn {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.error-code {
    font-family: "DynaPuff", sans-serif;

    font-size: clamp(
        95px,
        25vw,
        170px
    );

    font-weight: 600;

    line-height: .9;

    letter-spacing: -7px;

    background:
        linear-gradient(
            135deg,
            #fff 0%,
            #ffd4ef 30%,
            #ff86d2 65%,
            #ff5fbd 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,100,200,.25)
        );

    margin-bottom: 18px;
}

.divider {
    width: 75px;
    height: 2px;

    margin: 0 auto 25px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff91d5,
            transparent
        );

    box-shadow:
        0 0 15px
        rgba(255,100,200,.5);
}

.title {
    font-family: "DynaPuff", sans-serif;

    font-size: 25px;
    font-weight: 500;

    color: #ffd0ef;

    margin-bottom: 12px;
}

.message {
    max-width: 500px;

    margin: 0 auto;

    font-size: 14px;

    line-height: 1.7;

    color: #ffe4f4;
}

.message strong {
    color: #ff9ddd;
    font-weight: 800;
}

.home-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 28px;

    padding: 13px 24px;

    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            #ff91d4,
            #ff69c4
        );

    color: #17000f;

    text-decoration: none;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 1.2px;

    box-shadow:
        0 0 25px
        rgba(255,100,200,.12);

    transition: .3s ease;
}

.home-button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 0 35px
        rgba(255,100,200,.25);

    filter: brightness(1.08);
}

.home-button:active {
    transform: scale(.97);
}

.footer {
    margin-top: 55px;

    font-size: 10px;

    color: #d6aeca;
}

.footer span {
    color: #ff91d4;
}

@media (max-width: 600px) {

    .page {
        padding: 35px 18px;
    }

    .error-code {
        font-size: 115px;
    }

    .title {
        font-size: 22px;
    }

    .message {
        font-size: 14px;
    }
}
</style>
</head>

<script src="/directory.js"></script>
</body>
</html>

<body>

<canvas id="stars"></canvas>

<main class="page">

    <div class="error-code">
        404
    </div>

    <div class="divider"></div>

    <h1 class="title">
        oopsie 𐙚
    </h1>

    <p class="message">
        Looks like this page wandered off somewhere.
        <br>
        The page you're looking for doesn't exist on
        <strong>Kabe.world</strong>.
    </p>

    <a
        class="home-button"
        href="/"
    >
        TAKE ME HOME →
    </a>

</main>

<script>
/* =========================
   INTERACTIVE STARFIELD
========================= */

const canvas =
    document.getElementById("stars");

const ctx =
    canvas.getContext("2d");

let stars = [];

let mouse = {
    x: -1000,
    y: -1000
};

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    createStars();
}

function createStars() {

    stars = [];

    const amount =
        Math.floor(
            (window.innerWidth *
            window.innerHeight) / 8500
        );

    for (let i = 0; i < amount; i++) {

        stars.push({

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                canvas.height,

            size:
                Math.random() *
                1.5 + .3,

            baseOpacity:
                Math.random() *
                .45 + .2,

            twinkle:
                Math.random() *
                Math.PI * 2,

            speed:
                Math.random() *
                .025 + .008
        });
    }
}

function drawStars() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const isTouchDevice =
        window.matchMedia(
            "(hover: none)"
        ).matches;

    for (const star of stars) {

        star.twinkle +=
            star.speed;

        const pulse =
            Math.sin(
                star.twinkle
            ) * .12;

        let opacity =
            star.baseOpacity +
            pulse;

        if (!isTouchDevice) {

            const dx =
                star.x - mouse.x;

            const dy =
                star.y - mouse.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const glowRadius = 150;

            if (distance < glowRadius) {

                const glow =
                    1 -
                    distance /
                    glowRadius;

                opacity +=
                    glow * .75;

                const glowSize =
                    star.size +
                    glow * 2.2;

                ctx.beginPath();

                ctx.arc(
                    star.x,
                    star.y,
                    glowSize,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(255,255,255,${Math.min(
                        opacity * .18,
                        .3
                    )})`;

                ctx.fill();
            }
        }

        opacity =
            Math.min(
                Math.max(
                    opacity,
                    .05
                ),
                1
            );

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${opacity})`;

        ctx.fill();
    }

    requestAnimationFrame(
        drawStars
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

window.addEventListener(
    "mousemove",
    function (event) {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;
    }
);

window.addEventListener(
    "mouseleave",
    function () {

        mouse.x = -1000;
        mouse.y = -1000;
    }
);

resizeCanvas();
drawStars();
</script>

</body>
</html>
